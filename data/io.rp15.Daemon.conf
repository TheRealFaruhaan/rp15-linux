<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.rp15.Daemon"/>
  </policy>
  <!-- The API only allows range-checked keyboard backlight and Fn lock writes. -->
  <policy context="default">
    <allow send_destination="io.rp15.Daemon"/>
  </policy>
</busconfig>
