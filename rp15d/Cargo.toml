[package]
name = "rp15d"
version = "1.0.0"
edition = "2021"
description = "Privileged helper for the Eluktronics RP-15: keyboard backlight, Fn lock, sleep-key confirmation"
license = "GPL-2.0-or-later"

[dependencies]
evdev = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync", "signal", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
